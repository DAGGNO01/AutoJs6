name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install CMake 3.10.2 manually
        run: |
          wget https://cmake.org/files/v3.10/cmake-3.10.2-Linux-x86_64.sh
          chmod +x cmake-3.10.2-Linux-x86_64.sh
          sudo ./cmake-3.10.2-Linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (assembleInrtRelease)
        run: ./gradlew assembleInrtRelease

      - name: Build with Gradle (assembleAppRelease)
        run: ./gradlew assembleAppRelease

      - name: Sign APKs
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"

          keytool -genkeypair \
            -v \
            -keystore test-release.jks \
            -alias autojs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AutoJs"

          mkdir -p signed

          for apk in app/build/outputs/apk/app/release/*.apk; do
            name=$(basename "$apk")

            "$BUILD_TOOLS/zipalign" \
              -f 4 \
              "$apk" \
              "aligned-$name"

            "$BUILD_TOOLS/apksigner" sign \
              --ks test-release.jks \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "signed/$name" \
              "aligned-$name"

            "$BUILD_TOOLS/apksigner" verify \
              --verbose \
              "signed/$name"
          done

      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-apk
          path: signed/*-arm64-v8a.apk

      - name: Upload armv7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-armv7-apk
          path: signed/*-v7a.apk

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-apk
          path: signed/*-universal.apk
