name: Android CI

on:
  push:
    branches: [ "master", "6.5.0"  ]
  pull_request:
    branches: [ "master", "6.5.0"  ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 20
        uses: actions/setup-java@v3
        with:
          java-version: '20'
          distribution: 'temurin'
          cache: gradle
          
      - name: Install CMake 3.10.2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.10.2.4988404" || true

      - name: Configure CMake
        run: echo "cmake.dir=$ANDROID_HOME/cmake/3.10.2.4988404" >> local.properties
      
      - name: Download RootShell
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/RootShell-1.6.aar "https://repo1.maven.org/maven2/com/github/Stericson/RootShell/1.6/RootShell-1.6.aar"
          file app/libs/RootShell-1.6.aar
          ls -lh app/libs/RootShell-1.6.aar
     
      - name: Grant execute permission for gradlew
        run: chmod +x gradle
        
      - name: Build with Gradle (assembleInrtRelease)
        run: ./gradlew assembleInrtRelease
        
      - name: Build with Gradle (assembleAppRelease)
        run: ./gradlew assembleAppRelease

      - name: Upload arm64 artifacts
        id: upload-arm64-apk
        uses: actions/upload-artifact@v4
        with:
          name: release-arm64-apk
          path: app/build/outputs/apk/app/release/*-arm64-v8a.apk
        continue-on-error: true

      - name: Upload armv7 artifacts
        id: upload-armv7-apk
        uses: actions/upload-artifact@v4
        with:
          name: release-armv7-apk
          path: app/build/outputs/apk/app/release/*-v7a.apk
        continue-on-error: true

      - name: Upload universal artifacts
        id: upload-universal-apk
        uses: actions/upload-artifact@v4
        with:
          name: release-universal-apk
          path: app/build/outputs/apk/app/release/*-universal.apk
        continue-on-error: true
